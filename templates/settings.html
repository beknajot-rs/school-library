{% extends 'base.html' %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <div>
        <h2 style="font-size: 1.5rem; font-weight: 700;">Tizim sozlamalari</h2>
        <p style="color: var(--text-secondary);">Kutubxona parametrlarini boshqarish.</p>
    </div>
</div>

<div style="display: grid; grid-template-columns: 1fr 2fr; gap: 2rem;">
    
    <!-- Settings Navigation -->
    <div style="background: var(--bg-card); border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); border: var(--glass-border); padding: 1rem;">
        <ul style="list-style: none;">
            <li><a href="#" style="display: block; padding: 1rem; background: rgba(79, 70, 229, 0.05); color: var(--primary-color); border-radius: var(--radius-md); font-weight: 500; text-decoration: none; margin-bottom: 0.5rem;"><i class='bx bx-building' style="margin-right: 0.5rem;"></i> Maktab ma'lumotlari</a></li>
            <li><a href="#" style="display: block; padding: 1rem; color: var(--text-secondary); border-radius: var(--radius-md); font-weight: 500; text-decoration: none; margin-bottom: 0.5rem; transition: all 0.2s;"><i class='bx bx-time' style="margin-right: 0.5rem;"></i> Ijara sozlamalari</a></li>
            <li><a href="#" style="display: block; padding: 1rem; color: var(--text-secondary); border-radius: var(--radius-md); font-weight: 500; text-decoration: none; margin-bottom: 0.5rem; transition: all 0.2s;"><i class='bx bx-user-pin' style="margin-right: 0.5rem;"></i> Foydalanuvchilar</a></li>
            <li><a href="#" style="display: block; padding: 1rem; color: var(--text-secondary); border-radius: var(--radius-md); font-weight: 500; text-decoration: none; margin-bottom: 0.5rem; transition: all 0.2s;"><i class='bx bx-category' style="margin-right: 0.5rem;"></i> Kitob kategoriyalari</a></li>
            <li><a href="#" style="display: block; padding: 1rem; color: var(--text-secondary); border-radius: var(--radius-md); font-weight: 500; text-decoration: none; transition: all 0.2s;"><i class='bx bx-list-ul' style="margin-right: 0.5rem;"></i> Sinf ro'yxati</a></li>
        </ul>
    </div>

    <!-- Active Settings Panel -->
    <div style="background: var(--bg-card); border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); border: var(--glass-border); padding: 2.5rem;">
        <h3 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1.5rem; color: var(--text-primary);">Maktab ma'lumotlari va Standart parametrlar</h3>
        
        <form action="{{ url_for('settings') }}" method="POST">
            <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                
                <div>
                    <label style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-secondary);">Maktab nomi</label>
                    <input type="text" name="school_name" value="{{ setting.school_name }}" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: var(--bg-main); color: var(--text-primary); font-family: inherit;">
                </div>
                
                <div>
                    <label style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-secondary);">Maktab manzili</label>
                    <input type="text" name="school_address" value="{{ setting.school_address }}" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: var(--bg-main); color: var(--text-primary); font-family: inherit;">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div>
                        <label style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-secondary);">Direktor ismi</label>
                        <input type="text" name="principal_name" value="{{ setting.principal_name }}" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: var(--bg-main); color: var(--text-primary); font-family: inherit;">
                    </div>
    
                    <div>
                        <label style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-secondary);">Standart ijara muddati (kun)</label>
                        <input type="number" name="standard_loan_days" value="{{ setting.standard_loan_days }}" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: var(--bg-main); color: var(--text-primary); font-family: inherit;">
                    </div>
                </div>

            </div>
            
            <div style="margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end;">
                <button type="submit" style="padding: 0.75rem 2rem; background: var(--primary-color); color: white; border: none; border-radius: var(--radius-md); font-family: inherit; font-size: 1rem; font-weight: 600; cursor: pointer; box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2); transition: all 0.2s;">
                    O'zgarishlarni saqlash
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
