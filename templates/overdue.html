{% extends 'base.html' %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">

    </div>
    
    <button style="padding: 0.75rem 1.5rem; background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); border-radius: var(--radius-md); font-family: inherit; font-size: 0.875rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; transition: all 0.2s;">
        <i class='bx bx-bell'></i> Barchasiga eslatma yuborish
    </button>
</div>

<!-- Overdue Table -->
<div class="table-container" style="border-top: 4px solid var(--danger);">
    <div style="overflow-x: auto;">
        <table class="custom-table">
            <thead>
                <tr>
                    <th>O'quvchi</th>
                    <th>Sinfi</th>
                    <th>Telefon</th>
                    <th>Kitob nomi</th>
                    <th>Berilgan sana</th>
                    <th>Muddati</th>
                    <th>Kechikish</th>
                    <th>Harakat</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dummy data -->
                <tr style="background: rgba(239, 68, 68, 0.02);">
                    <td style="font-weight: 600;">Eshmatov Toshmat</td>
                    <td>9 "B"</td>
                    <td>+998 90 999 88 77</td>
                    <td style="font-weight: 500;">Algebra 9-sinf</td>
                    <td>2026-02-15</td>
                    <td style="color: var(--danger); font-weight: 500;">2026-03-01</td>
                    <td><span style="background: var(--danger); color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600;">13 kun</span></td>
                    <td>
                        <button style="padding: 0.4rem 0.8rem; background: var(--primary-color); color: white; border: none; border-radius: var(--radius-sm); font-family: inherit; font-size: 0.75rem; font-weight: 500; cursor: pointer;">
                            Eslatma
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
